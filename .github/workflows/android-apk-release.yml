name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Installable APK
        run: gradle assembleDebug

      - name: Rename APK for Direct Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KRS-Gold-Silver-Live-MCX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRS-Gold-Silver-Live-MCX-APK
          path: KRS-Gold-Silver-Live-MCX.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KRS Gold & Silver Live MCX v1.0.${{ github.run_number }} (.apk)"
          body: |
            ### 📲 Direct Android APK Download
            Click **`KRS-Gold-Silver-Live-MCX.apk`** below under **Assets** to download and install the app directly on your Android phone!
            - Built by **K.M. Jashwanth** (`kmjashwanth01@gmail.com`)
            - Powered by **JASHX AI (Gemini 3.8 Flash)** & **KRS Bullion 1s Live Feed**
          files: KRS-Gold-Silver-Live-MCX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
