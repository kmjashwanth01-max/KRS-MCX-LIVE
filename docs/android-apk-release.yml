name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK for Download
        run: |
          cp app/build/outputs/apk/release/app-release.apk KRS-Gold-Silver-Live-MCX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRS-Gold-Silver-Live-MCX-APK
          path: KRS-Gold-Silver-Live-MCX.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KRS Gold & Silver Live MCX v1.0.${{ github.run_number }} (.apk)"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### Direct Android APK Download
            Download **`KRS-Gold-Silver-Live-MCX.apk`** below to install directly on your Android phone.
          files: KRS-Gold-Silver-Live-MCX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
